<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMIÉ 공식 스토어</title>
<meta name="description" content="LUMIÉ 숄더백 · 에코백 · 비니 · 키링 공식 스토어">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF7F2}
a{color:#7A2232}a:hover{color:#5A1724}
input,textarea,button{font:inherit}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="font-family: 'Noto Sans KR', system-ui, sans-serif; background: #FAF7F2; color: #1C1B1F; min-height: 100vh; line-height: 1.6">

<div style="background: #7A2232; color: #FAF7F2; text-align: center; font-size: 14px; font-weight: 500; padding: 9px 16px">첫 구매 시 빛 반사 백참 증정 · 5만원 이상 무료배송 · 수령 후 7일 교환·반품</div>

<header style="background: #FAF7F2; border-bottom: 1px solid #E6E0D6">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
<button type="button" onClick="{{goHome}}" aria-label="LUMIÉ 홈" style="background: none; border: 0; padding: 6px 0; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 0.18em; color: #1C1B1F">LUMIÉ</button>
<nav aria-label="카테고리" style="display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 15px; font-weight: 500">
<button type="button" onClick="{{openNew}}" style="background: none; border: 0; padding: 10px 0; cursor: pointer; color: #7A2232; font-weight: 700">신상품</button>
<button type="button" onClick="{{goShopAll}}" style="background: none; border: 0; padding: 10px 0; cursor: pointer; color: #1C1B1F">전체상품</button>
<button type="button" onClick="{{goShopBag}}" style="background: none; border: 0; padding: 10px 0; cursor: pointer; color: #1C1B1F">가방</button>
<button type="button" onClick="{{goBrand}}" style="background: none; border: 0; padding: 10px 0; cursor: pointer; color: #1C1B1F">브랜드</button>
</nav>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; font-size: 14px">
<button type="button" onClick="{{goTrack}}" style="background: none; border: 0; padding: 10px 0; cursor: pointer; color: #5E5B63">주문조회</button>
<button type="button" onClick="{{goHelp}}" style="background: none; border: 0; padding: 10px 0; cursor: pointer; color: #5E5B63">고객센터</button>
<button type="button" onClick="{{goCart}}" aria-label="장바구니 {{cartCount}}개" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFC7BB; background: #FFFFFF; cursor: pointer; color: #1C1B1F; font-weight: 500">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
장바구니 <span style="min-width: 22px; height: 22px; border-radius: 999px; background: #7A2232; color: #FFFFFF; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px">{{cartCount}}</span>
</button>
</div>
</div>
</header>

<main>

<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div>
<section style="max-width: 1240px; margin: 0 auto; padding: 64px 24px 80px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
<div style="flex: 1 1 420px; min-width: 0">
<p style="margin: 0 0 18px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; letter-spacing: 0.3em; color: #7A2232">LUMIÉ  /  2026 COLLECTION</p>
<h1 style="margin: 0; font-size: clamp(42px, 6vw, 72px); line-height: 1.15; font-weight: 900; letter-spacing: -0.02em">매일 들기 좋은<br>가방.</h1>
<p style="margin: 24px 0 0; font-size: 18px; color: #5E5B63; max-width: 460px">숄더백, 에코백, 키링까지. 가볍고 편하게 쓰는 LUMIÉ의 데일리 컴렉션이에요.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px">
<button type="button" onClick="{{openNew}}" style="min-height: 52px; background: #7A2232; color: #FFFFFF; border: 0; border-radius: 999px; font-weight: 700; padding: 0 30px; cursor: pointer">신상품 보기 · {{newPrice}}</button>
<button type="button" onClick="{{goShopAll}}" style="min-height: 52px; background: transparent; color: #1C1B1F; border: 1px solid #CFC7BB; border-radius: 999px; font-weight: 500; padding: 0 28px; cursor: pointer">전체상품 보기</button>
</div>
</div>
<div style="flex: 1 1 380px; min-width: 0; display: flex; justify-content: center">
<div style="width: 100%; max-width: 460px; border-radius: 28px; overflow: hidden; border: 1px solid #E6E0D6; box-shadow: 0 24px 60px rgba(122, 34, 50, 0.14)">
<img src="images/p-up-hero.jpg" alt="버건디 Glow Shoulder Bag" style="display: block; width: 100%; height: auto">
</div>
</div>
</section>

<section style="border-top: 1px solid #E6E0D6; border-bottom: 1px solid #E6E0D6; background: #FFFFFF">
<div style="max-width: 1240px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<div style="display: flex; align-items: center; gap: 14px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A2232" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="13" height="10" rx="1"></rect><path d="M15 10h4l3 3v4h-7z"></path><circle cx="6" cy="18" r="1.6"></circle><circle cx="18" cy="18" r="1.6"></circle></svg>
<div><p style="margin: 0; font-weight: 700">5만원 이상 무료배송</p><p style="margin: 0; font-size: 14px; color: #5E5B63">그 외 배송비 3,000원</p></div>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A2232" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"></path></svg>
<div><p style="margin: 0; font-weight: 700">프리미엄 소재</p><p style="margin: 0; font-size: 14px; color: #5E5B63">이탈리아산 소가죽 · 나일론</p></div>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A2232" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6"></path><path d="M5 10v8M9 10v8M15 10v8M19 10v8"></path><path d="M3 20h18"></path></svg>
<div><p style="margin: 0; font-weight: 700">계좌이체 간편 결제</p><p style="margin: 0; font-size: 14px; color: #5E5B63">카카오뱅크로 입금</p></div>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A2232" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.2"></path><path d="M4 4v4h4"></path></svg>
<div><p style="margin: 0; font-weight: 700">수령 후 7일 내 교환·반품</p><p style="margin: 0; font-size: 14px; color: #5E5B63">불량 시 배송비 무료</p></div>
</div>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 88px 24px 0">
<p style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; letter-spacing: 0.3em; color: #7A2232">WHY LUMIÉ</p>
<h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 40px); font-weight: 900">LUMIÉ를 사야 하는 4가지 이유</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 32px">
<div style="background: #FFFFFF; border: 1px solid #E6E0D6; border-radius: 20px; padding: 28px">
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; color: #7A2232">01</p>
<h3 style="margin: 10px 0 6px; font-size: 20px">밤에도 빛나는 나</h3>
<p style="margin: 0; color: #5E5B63">조명이나 불빛을 받으면 은은하게 드러나는 빛 반사 라인. 다른 가방에는 없는 LUMIÉ만의 시그니처예요.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #E6E0D6; border-radius: 20px; padding: 28px">
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; color: #7A2232">02</p>
<h3 style="margin: 10px 0 6px; font-size: 20px">20대 지갑에 맞는 가격</h3>
<p style="margin: 0; color: #5E5B63">에코백 {{ecoPrice}}, 신상 숄더백 {{newPrice}}. 매일 들 가방을 부담 없는 가격에 만나요.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #E6E0D6; border-radius: 20px; padding: 28px">
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; color: #7A2232">03</p>
<h3 style="margin: 10px 0 6px; font-size: 20px">가볍고 넉넉하게</h3>
<p style="margin: 0; color: #5E5B63">약 420 g의 가벼운 무게에 13인치 노트북까지 쏙. 수업, 출근, 약속까지 가방 하나로 충분해요.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #E6E0D6; border-radius: 20px; padding: 28px">
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; color: #7A2232">04</p>
<h3 style="margin: 10px 0 6px; font-size: 20px">부담 없는 첫 구매</h3>
<p style="margin: 0; color: #5E5B63">첫 구매 시 빛 반사 백참 증정, 5만원 이상 무료배송, 수령 후 7일 안에 교환·반품까지.</p>
</div>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 72px 24px 0">
<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 8px 8px 8px 0">
<p style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; letter-spacing: 0.3em; color: #7A2232">DAY &amp; NIGHT</p>
<h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.25; font-weight: 900">낮에는 데일리백,<br>밤에는 포인트백.</h2>
<p style="margin: 16px 0 0; color: #5E5B63; font-size: 17px">낮에는 깔끔하게, 밤에 불빛을 받으면 양옆의 반사 라인이 드러나요. 늦은 귀가길에도 나만의 스타일을 지켜 줘요.</p>
<button type="button" onClick="{{openNew}}" style="margin-top: 28px; align-self: flex-start; min-height: 52px; background: #7A2232; color: #FFFFFF; border: 0; border-radius: 999px; font-weight: 700; padding: 0 28px; cursor: pointer">Glow Shoulder Bag 보기</button>
</div>
<figure style="flex: 1 1 260px; min-width: 0; margin: 0; position: relative; border-radius: 24px; overflow: hidden; background: #FFFFFF; border: 1px solid #E6E0D6">
<img src="images/p-up-hero.jpg" alt="낮에 본 Glow Shoulder Bag" style="display: block; width: 100%; height: 100%; min-height: 360px; object-fit: cover">
<figcaption style="position: absolute; top: 16px; left: 16px; background: #FFFFFF; color: #1C1B1F; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; padding: 6px 12px; border-radius: 999px">DAY</figcaption>
</figure>
<figure style="flex: 1 1 260px; min-width: 0; margin: 0; position: relative; border-radius: 24px; overflow: hidden; background: #0D0E11">
<img src="images/p-up-detail.jpg" alt="밤에 빛을 받아 반사 라인이 드러난 모습" style="display: block; width: 100%; height: 100%; min-height: 360px; object-fit: cover; filter: brightness(0.55) contrast(1.25) saturate(1.1)">
<figcaption style="position: absolute; top: 16px; left: 16px; background: #1C1B1F; color: #FAF7F2; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; padding: 6px 12px; border-radius: 999px">NIGHT</figcaption>
<p style="position: absolute; left: 16px; bottom: 14px; margin: 0; color: #FAF7F2; font-size: 12px">연출 이미지예요</p>
</figure>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 72px 24px 0">
<div style="background: #F2ECE3; border-radius: 28px; padding: 40px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center">
<div style="flex: 1 1 280px; min-width: 0">
<p style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; letter-spacing: 0.3em; color: #7A2232">FOR YOU</p>
<h2 style="margin: 0; font-size: clamp(26px, 3vw, 34px); font-weight: 900">이런 분께 추천해요</h2>
</div>
<ul style="flex: 2 1 420px; min-width: 0; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; font-size: 17px">
<li style="display: flex; gap: 12px; align-items: flex-start"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A2232" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; margin-top: 3px"><path d="M5 12l5 5 9-10"></path></svg>밤늦게 귀가하거나 외출이 잦은 대학생·사회초년생</li>
<li style="display: flex; gap: 12px; align-items: flex-start"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A2232" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; margin-top: 3px"><path d="M5 12l5 5 9-10"></path></svg>편하면서도 가방으로 룩에 포인트를 주고 싶은 분</li>
<li style="display: flex; gap: 12px; align-items: flex-start"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A2232" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: 0 0 auto; margin-top: 3px"><path d="M5 12l5 5 9-10"></path></svg>노트북, 책, 파우치까지 한 번에 들고 다니는 분</li>
</ul>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 80px 24px 24px">
<p style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; letter-spacing: 0.3em; color: #7A2232">NEW ARRIVAL</p>
<h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 40px); font-weight: 900">신상품</h2>
<div style="margin-top: 28px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; background: #F2ECE3; border-radius: 28px; padding: 32px">
<div style="flex: 1 1 320px; min-width: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{newColors}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.open}}" aria-label="{{c.ko}} 보기" style="padding: 0; border: 1px solid #E6E0D6; border-radius: 14px; background: #FFFFFF; cursor: pointer; overflow: hidden"><img src="{{c.img}}" alt="" style="display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: contain"></button>
</sc-for>
</div>
<div style="flex: 1 1 320px; min-width: 0">
<span style="display: inline-block; background: #7A2232; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 999px">NEW</span>
<h3 style="margin: 12px 0 0; font-size: 30px; font-weight: 900">Glow Shoulder Bag</h3>
<p style="margin: 6px 0 0; color: #5E5B63">보부상 숄더백 · 5 colors</p>
<p style="margin: 14px 0 0; font-size: 24px; font-weight: 900">{{newPrice}}</p>
<button type="button" onClick="{{openNew}}" style="margin-top: 20px; min-height: 52px; background: #1C1B1F; color: #FAF7F2; border: 0; border-radius: 999px; font-weight: 700; padding: 0 28px; cursor: pointer">자세히 보기</button>
</div>
</div>
</section>

<section style="max-width: 1240px; margin: 0 auto; padding: 72px 24px 24px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<p style="margin: 0 0 8px; font-family: 'Space Grotesk', sans-serif; font-size: 14px; letter-spacing: 0.3em; color: #7A2232">ALL PRODUCTS</p>
<h2 style="margin: 0; font-size: clamp(28px, 3.4vw, 40px); font-weight: 900">LUMIÉ 컬렉션</h2>
</div>
<button type="button" onClick="{{goShopAll}}" style="background: none; border: 0; padding: 10px 0; cursor: pointer; color: #7A2232; font-weight: 700">전체보기 →</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 32px 20px; margin-top: 32px">
<sc-for list="{{homeProducts}}" as="p" hint-placeholder-count="9">
<button type="button" onClick="{{p.open}}" style="background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: #1C1B1F">
<span style="display: block; position: relative; background: #FFFFFF; border: 1px solid #E6E0D6; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 5">
<sc-if value="{{p.hasImg}}" hint-placeholder-val="{{ true }}"><img src="{{p.img}}" alt="{{p.alt}}" style="display: block; width: 100%; height: 100%; object-fit: contain"></sc-if>
<sc-if value="{{p.isStrap}}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 100%; background: #F2ECE3; color: #5E5B63; font-size: 13px"><svg aria-hidden="true" width="72" height="72" viewBox="0 0 64 64" fill="none" stroke="#7A2232" stroke-width="2" stroke-linecap="round"><path d="M10 50C14 20 50 20 54 50"></path><path d="M14 40C20 26 44 26 50 40" stroke-dasharray="3 4"></path><rect x="6" y="48" width="8" height="6" rx="1"></rect><rect x="50" y="48" width="8" height="6" rx="1"></rect></svg>사진 준비 중</span></sc-if>
<sc-if value="{{p.isCharm}}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 100%; background: #F2ECE3; color: #5E5B63; font-size: 13px"><svg aria-hidden="true" width="72" height="72" viewBox="0 0 64 64" fill="none" stroke="#7A2232" stroke-width="2" stroke-linecap="round"><circle cx="32" cy="12" r="6"></circle><path d="M32 18v8"></path><path d="M32 26l14 14-14 14-14-14z"></path><path d="M26 40h12" stroke-dasharray="2 3"></path></svg>사진 준비 중</span></sc-if>
<sc-if value="{{p.photoSoon}}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 100%; background: #F2ECE3; color: #5E5B63; font-size: 14px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0.2em; color: #7A2232">COMING SOON</span>사진 준비 중</span></sc-if>
<sc-if value="{{p.badge}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: 12px; left: 12px; background: #7A2232; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 999px">{{p.badge}}</span></sc-if>
</span>
<span style="display: block; margin-top: 14px; font-weight: 700">{{p.name}}</span>
<span style="display: block; font-size: 14px; color: #5E5B63">{{p.sub}}</span>
<span style="display: flex; gap: 6px; margin-top: 6px; min-height: 12px"><sc-for list="{{p.dots}}" as="d" hint-placeholder-count="5"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; border: 1px solid #8A8C94; background: {{d.hex}}"></span></sc-for></span>
<span style="display: block; margin-top: 6px; font-weight: 900; font-size: 17px">{{p.priceStr}}</span>
</button>
</sc-for>
</div>
</section>
